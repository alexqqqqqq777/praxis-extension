# Дві вітрини: основна тут-таки на VPS, запасна — на домашній машині через
# tailnet. nginx сам піде на запасну, коли локальна не відповідає: зупинка
# сервісу, перезавантаження VPS, невдале оновлення. Розширення про це не знає
# і знати не має — адреса для нього та сама.
#
# Запасна слухає ЛИШЕ адресу tailnet: у домашній мережі порт закритий, назовні
# теж. Домашній IP юристові не видно — він бачить тільки цей VPS.
# 17.09.2026 основною стала домашня машина `adv`, а не VPS.
#
# Причина не в коді: глибокий зріз (10,08 ГБ, практика з 2018 року) на цю
# машину не влазить — 38 ГБ диска, з них вільно 9,4, а атомарна підміна
# потребує вдвічі. Та й 1,9 ГБ ОЗП означають, що база такого розміру не
# потрапить у сторінковий кеш ніколи.
#
# Тут лишається те, заради чого цей вузол і потрібен: публічна адреса, TLS,
# відсутність журналу і те, що домашня IP-адреса юристові не видна. Сам
# сервіс `praxis-cards` тут зупинено й вимкнено з автозапуску.
#
# 17.09.2026 додано запасну: `adv` — домашня Windows, яка падає від оновлень,
# сну й провайдера, і до сьогодні була єдиним вузлом даних. Mac Studio нічого
# не коштує: зріз збирається саме там, тобто він там завжди найсвіжіший.
upstream praxis {
    # 17.09.2026, увечері — ТИМЧАСОВО помінялися місцями, і не через швидкість.
    #
    # На adv лишився код, старший за сьогоднішні виправлення: /ecthr/docs
    # рахував ліміт до згортки й показував 17 рішень ВС замість 45. Юрист бачив
    # це як «справу цитували втричі рідше». Зріз там свіжий, а код — ні, і
    # доставки коду на adv у нас досі немає (див. підміну з відкатом у планах).
    #
    # Повернути ролі, щойно на adv поїде код: adv швидший від Studio удвічі
    # (p95 93 мс проти 182 мс із VPS) і не зайнятий нічними конвеєрами.
    server 100.118.205.24:8788   max_fails=2 fail_timeout=10s;   # Mac Studio, свіжий код
    server 100.70.93.113:8788    backup;                          # adv, поки зі старим кодом
}

# Praxis — вітрина практики ВС. TLS, щоб номер статті й текст пошуку юриста
# не йшли мережею відкритим текстом. Журнал вимкнено свідомо: ані access_log,
# ані error_log нижче critical — жодного запису про те, хто що читав.
server {
    listen 80;
    listen [::]:80;
    server_name praxis.51-83-129-254.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name praxis.51-83-129-254.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/praxis.51-83-129-254.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/praxis.51-83-129-254.sslip.io/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Головне в цьому файлі. Інакше nginx поверне рівно той журнал
    # «хто яку статтю читав», який ми щойно прибрали з самого сервісу.
    access_log off;
    error_log  /dev/null crit;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://praxis;
        # переходимо на запасну не лише коли зʼєднання впало, а й коли основна
        # відповіла помилкою: інакше юрист побачить 502 замість карток
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 3s;
        proxy_http_version 1.1;
        # IP користувача далі не передаємо: застосунку він не потрібен
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_read_timeout 30;
    }
}
