# Praxis — вітрина практики ВС. TLS, щоб номер статті й текст пошуку юриста
# не йшли мережею відкритим текстом. Журнал вимкнено свідомо: ані access_log,
# ані error_log нижче critical — жодного запису про те, хто що читав.
server {
    listen 80;
    listen [::]:80;
    server_name praxis.51-83-129-254.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name praxis.51-83-129-254.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/praxis.51-83-129-254.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/praxis.51-83-129-254.sslip.io/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Головне в цьому файлі. Інакше nginx поверне рівно той журнал
    # «хто яку статтю читав», який ми щойно прибрали з самого сервісу.
    access_log off;
    error_log  /dev/null crit;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        # IP користувача далі не передаємо: застосунку він не потрібен
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_read_timeout 30;
    }
}
